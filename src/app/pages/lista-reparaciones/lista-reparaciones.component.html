<header>
    <h2>EMPLEADOS</h2>
    <i class="fa-solid fa-print"></i>
</header>
<select (change)="filtrarPorEstado($event)">
    <option value="">Todas las Reparaciones</option>
    <option value="pendiente">pendiente</option>
    <option value="en_progreso">en_progreso</option>
    <option value="finalizado">finalizado</option>
</select>
<select (change)="filtrarPorFecha($event)">
    <option value="">Todas las fechas</option>
    <option value="fecha_ingreso">Filtrar mas reciente</option>
    <option value="filtrarPorFecha">Filtrar mas antigua</option>
</select>
<div class="table table-responsive">
    <table>
        <th>Ref.</th>
        <th>Entrada</th>
        <th>Vehículo</th>
        <th>Mecánico</th>
        <th>Estado</th>
        @for(reparacion of reparaciones;track $index){

        <tr>
            <td>{{reparacion.id}}</td>
            <td>{{reparacion.fecha_ingreso | date: 'dd/MM/yyyy'}}</td>
            <td>{{reparacion.vehiculo}}</td>
            <td>{{reparacion.mecanico}}</td>
            <td [style]="getEstiloEstado(reparacion.estado)">{{reparacion.estado}}</td>
            <td><button class="btn btn-info" [routerLink]="[`/admin/reparacion/${reparacion.id}`]">Ver detalle</button>
            </td>
        </tr>


        }
    </table>
</div>
