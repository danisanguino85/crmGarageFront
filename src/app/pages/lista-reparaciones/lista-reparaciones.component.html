<h2>REPARACIONES</h2>
@for(reparacion of reparaciones;track $index){
<ul class="list-group list-group-horizontal" [routerLink]="[`/admin/reparacion/${reparacion.id}`]">
    <li class="list-group-item w-100">{{reparacion.id}}</li>
    <li class="list-group-item w-100">VEHICULO</li>
    <li class="list-group-item w-100">{{reparacion.fecha_ingreso}}</li>
    <li class="list-group-item w-100">{{reparacion.estado}}</li>

</ul>

}
