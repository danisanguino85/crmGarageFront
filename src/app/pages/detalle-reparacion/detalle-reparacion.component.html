<div class="detalle-panel">
  <div class="wrapper">
    <h2 class="titulo">Panel de Reparación: Jean Franco</h2>

    <div class="contenido-principal">
      <!-- Zona derecha: botones -->
      <div class="acciones">
        <button [routerLink]="['/reparacion', this.reparacionId, 'vehiculo']">
          🚗 Vehículo
        </button>
        <button [routerLink]="['/reparacion', this.reparacionId, 'cliente']">
          👤 Cliente
        </button>
      </div>

      <!-- Zona central: card + nota -->
      <div class="contenido-dinamico">
        <div class="card-detalle">
          <router-outlet></router-outlet>
        </div>

        <div class="zona-nota">
          <label for="nota">Añadir nota:</label>
          <textarea
            id="nota"
            placeholder="Escribe una nota importante..."
          ></textarea>
          <button class="btn-nota">Enviar nota</button>
        </div>
      </div>
    </div>
  </div>
</div>
