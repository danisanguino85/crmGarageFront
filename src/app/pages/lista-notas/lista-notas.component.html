@for (nota of arrReparacionNotas; track $index) {

<div class="card-nota">
  <div class="nota-header">
    <span class="nota-id">📝 Nota #{{ nota.id }}</span>
    <p class="nota-fecha">
      <span class="material-icons">schedule</span>
      <span class="fecha-nota">{{
        nota.created_at | date : "EEEE d 'de' MMMM, HH:mm"
      }}</span>
    </p>
  </div>

  <p class="nota-texto">{{ nota.notas }}</p>
</div>
}
<ngx-sonner-toaster richColors position="bottom-center" />
