<div class="general">
    <div class="lateral">
        <ul>
            <li [routerLink]="['/admin', 'clientes']">Clientes</li>
            <li [routerLink]="['/admin', 'usuarios']">Empleados</li>
            <li [routerLink]="['/admin', 'reparaciones']">Notas de taller</li>
        </ul>
        <form class="mb-3" [formGroup]="searchClienteForm" (ngSubmit)="onSubmitCliente()">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" formControlName="telefono">
            <input type="submit">
        </form>
        <form class="mb-3" [formGroup]="searchReparacionForm" (ngSubmit)="onSubmitReparacion()">
            <label class="form-label">Nota de taller</label>
            <input type="text" class="form-control" formControlName="notaTaller">
            <input type="submit">

        </form>
        <form class="mb-3" [formGroup]="searchVehiculoForm" (ngSubmit)="onSubmitMatricula()">
            <label class="form-label">Vehículo</label>
            <input type="text" class="form-control" formControlName="matricula">
            <input type="submit">

        </form>
    </div>

    <div class="main">

        <div class="routerOutlet">
            <router-outlet />
        </div>

    </div>




</div>
