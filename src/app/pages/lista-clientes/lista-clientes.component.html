<h2>CLIENTES</h2>
<div class="table table-responsive">
    <table>
        <th>Nombre</th>
        <th>Apellidos</th>
        <th>Teléfono</th>
        <th>Email</th>
        @for(cliente of clientes;track $index){

        <tr>
            <td>{{cliente.nombre}}</td>
            <td>{{cliente.apellidos}}</td>
            <td>{{cliente.telefono}}</td>
            <td>{{cliente.email}}</td>
            <td><button class="btn btn-info" [routerLink]="[`/admin/cliente/${cliente.id}`]">Ver detalle</button></td>

        </tr>
        }
    </table>
</div>
