<header>
    <h2>CLIENTES</h2>
    <div>
        <button (click)="paginaAnterior()">anterior</button>
        <button (click)="siguientePagina()">siguiente</button>
        <i class="fa-solid fa-print"></i>
    </div>
</header>
<div class="table table-responsive">
    <table>
        <th>Nombre</th>
        <th>Apellidos</th>
        <th>Teléfono</th>
        <th class="email">Email</th>
        @for(cliente of clientes;track $index){

        <tr [routerLink]="[`/admin/cliente/${cliente.id}`]">
            <!--ver cómo lo desactivo para activarlo en tamaños inferiores-->
            <td>{{cliente.nombre}}</td>
            <td>{{cliente.apellidos}}</td>
            <td>{{cliente.telefono}}</td>
            <td class="email">{{cliente.email}}</td>
            <td class="boton"><button class="btn btn-info" [routerLink]="[`/admin/cliente/${cliente.id}`]">Ver
                    detalle</button></td>
        </tr>
        }
    </table>
</div>
<ngx-sonner-toaster richColors position="bottom-center" />
