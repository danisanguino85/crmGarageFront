<h2>CLIENTES</h2>
@for(cliente of clientes;track $index){
<ul class="list-group list-group-horizontal" [routerLink]="[`/admin/cliente/${cliente.id}`]">
    <li class="list-group-item w-100">{{cliente.nombre}} {{cliente.apellidos}}</li>
    <li class="list-group-item w-100">{{cliente.telefono}}</li>
    <li class="list-group-item w-100">{{cliente.email}}</li>

</ul>

}
