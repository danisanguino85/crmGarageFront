<header>
    <h2>EMPLEADOS</h2>
    <i class="fa-solid fa-print"></i>
</header>
<select (change)="filtrarPorRol($event)">
    <option value="">Todas</option>
    <option value="admin">Admin</option>
    <option value="mecanico">Mecanico</option>
</select>
<div class="table table-responsive">
    <table>
        <th>Empleados</th>
        <th>Teléfono</th>
        <th>Email</th>
        <th>Rol</th>
        @for(usuario of usuarios;track $index){

        <tr>
            <td>{{usuario.nombre}}</td>
            <td>{{usuario.telefono| date: 'dd/MM/yyyy'}}</td>
            <td>{{usuario.email}}</td>
            <td>{{usuario.rol}}</td>
            <td><button class="btn btn-info" [routerLink]="[`/admin/usuario/${usuario.id}`]">Ver detalle</button>
        </tr>


        }
    </table>
</div>
