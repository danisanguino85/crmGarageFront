<h2>EMPLEADOS</h2>
@for(usuario of arrUsuario;track $index){
<ul class="list-group list-group-horizontal" [routerLink]="[`/admin/usuario/${usuario.id}`]">
    <li class="list-group-item w-100">{{usuario.nombre}} {{usuario.apellidos}}</li>
    <li class="list-group-item w-100">{{usuario.telefono}}</li>
    <li class="list-group-item  w-100">{{usuario.email}}</li>
    <li class="list-group-item w-100">{{usuario.rol}}</li>
</ul>
}
