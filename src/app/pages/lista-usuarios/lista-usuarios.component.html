<header>
  <div>
    <h2>LISTADO DE EMPLEADOS</h2>
    <select (change)="filtrarPorRol($event)">
      <option value="">Todas</option>
      <option value="admin">Admin</option>
      <option value="mecanico">Mecanico</option>
    </select>
  </div>
  <i class="fa-solid fa-print"></i>
</header>
<div class="table table-responsive">
  <table>
    <th>Empleados</th>
    <th>Teléfono</th>
    <th class="email">Email</th>
    <th>Rol</th>
    @for(usuario of usuarios;track $index){

    <tr [routerLink]="[`/admin/usuario/${usuario.id}`]">
      <!--ver cómo lo desactivo para tamaños inferiores-->
      <td>{{ usuario.nombre }} {{ usuario.apellidos }}</td>
      <td>{{ usuario.telefono }}</td>
      <td class="email">{{ usuario.email }}</td>
      <td>{{ usuario.rol }}</td>
      <td class="boton">
        <button
          class="btn btn-info"
          [routerLink]="[`/admin/usuario/${usuario.id}`]"
        >
          Ver detalle
        </button>
      </td>
    </tr>

    }
  </table>
</div>
<ngx-sonner-toaster richColors position="bottom-center" />
