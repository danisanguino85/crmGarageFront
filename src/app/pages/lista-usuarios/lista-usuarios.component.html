<h2>EMPLEADOS</h2>
<div class="table table-responsive">
    <table>
        <th>EMPLEADO</th>
        <th>TELÉFONO</th>
        <th>EMAIL</th>
        <th>ROL</th>
        @for(usuario of usuarios;track $index){

        <tr [routerLink]="[`/admin/usuario/${usuario.id}`]">
            <td>{{usuario.nombre}}</td>
            <td>{{usuario.telefono| date}}</td>
            <td>{{usuario.email}}</td>
            <td>{{usuario.rol}}</td>
        </tr>


        }
    </table>
</div>
