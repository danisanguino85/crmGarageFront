<h2>EMPLEADOS</h2>
<select (change)="filtrarPorRol($event)">
    <option value="">Todas</option>
    <option value="admin">Admin</option>
    <option value="mecanico">Mecanico</option>
</select>
<div class="table table-responsive">
    <table>
        <th>Empleados</th>
        <th>Teléfono</th>
        <th>Email</th>
        <th>Rol</th>
        @for(usuario of usuarios;track $index){

        <tr [routerLink]="[`/admin/usuario/${usuario.id}`]">
            <td>{{usuario.nombre}}</td>
            <td>{{usuario.telefono| date: 'dd/MM/yyyy'}}</td>
            <td>{{usuario.email}}</td>
            <td>{{usuario.rol}}</td>
        </tr>


        }
    </table>
</div>
